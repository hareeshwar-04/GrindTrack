<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>GrindTrack — Stay Consistent Together</title>
    <meta name="description" content="A private accountability platform where friends set daily goals, eliminate procrastination, track streaks, and stay consistent together." />

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>

      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch(err => console.log('SW reg error:', err));
        });
      }
    </script>
  </body>
